services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lzre
      POSTGRES_PASSWORD: lzre
      POSTGRES_DB: lzre
    ports:
      - "5432:5432"
    volumes:
      - lzre_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lzre -d lzre"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lzre_pg:
